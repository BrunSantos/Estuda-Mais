-radius:9px;cursor:pointer}#epboot button[hidden]{display:none}.epbook{position:relative;width:100px;height:76px;margin:8px auto 22px;perspective:500px;filter:drop-shadow(0 7px 6px #193e7033)}.epbook .epcover{position:absolute;inset:5px 3px 0;border-radius:4px 9px 9px 4px;background:#2366b1;transform:skewY(-3deg)}.epbook .epleft,.epbook .epright{position:absolute;top:10px;bottom:8px;width:47px;background:#fffef6;border:2px solid #c8d9e8}.epbook .epleft{left:5px;border-radius:8px 2px 2px 5px;transform:skewY(7deg)}.epbook .epright{right:5px;border-radius:2px 8px 5px 2px;transform:skewY(-7deg)}.epbook .eppage{position:absolute;top:11px;left:50%;width:44px;height:57px;border-radius:2px 7px 6px 2px;background:linear-gradient(90deg,#dce9f5,#fffdf5 18%,#fffdf5 90%,#e2ebf3);border:1px solid #cbdbe9;transform-origin:left center;animation:epflip 1.65s ease-in-out infinite}.epbook .eppage:nth-last-child(2){animation-delay:.36s}.epbook .eppage:last-child{animation-delay:.72s}@keyframes epflip{0%,13%{transform:rotateY(0deg)}60%,100%{transform:rotateY(-178deg)}}@media(prefers-reduced-motion:reduce){.epbook .eppage{animation:none}}</style><script defer src="../assets/estuda-qr.js?v=54.2"></script></head><body><div id="epboot" role="status" aria-live="polite"><div><div class="epbook" aria-hidden="true"><span class="epcover"></span><span class="epleft"></span><span class="epright"></span><span class="eppage"></span><span class="eppage"></span><span class="eppage"></span></div><h2>🔐 A entrar na tua conta…</h2><p id="epbootmessage">Só um instante, estamos a confirmar a tua sessão.</p><p id="epbooterror"></p><button type="button" id="epbootretry" hidden onclick="location.reload()">Tentar novamente</button></div></div><script>(function(){function fail(message){var box=document.getElementById('epboot');if(!box)return;document.getElementById('epbootmessage').textContent='Não foi possível iniciar a sessão.';document.getElementById('epbootretry').hidden=false;document.getElementById('epbooterror').textContent=message;}window.estudaBootFail=fail;if(location.protocol==='file:'){fail('Estás a abrir o ficheiro diretamente. Abre o Estuda+ através do servidor local (http://localhost:8000) ou do site publicado.');}else{setTimeout(function(){if(document.getElementById('epboot'))fail('A ligação está a demorar mais do que o esperado. Verifica a internet e tenta novamente.');},12000)}})();</script><header><h1>Frações e números decimais</h1><p>Matemática · 5.º ano</p></header><main><a class="back" href="index.html#matematica">← Voltar a Matemática</a><div class="card"><strong>Ficha de treino original · Escolha múltipla</strong><p>8 perguntas com quatro opções. Seleciona uma resposta por pergunta e carrega em «Corrigir respostas».</p></div><form id="quiz"></form><div class="card"><button type="button" id="check">Corrigir respostas</button> <button type="button" id="reset" style="background:#536780">Recomeçar</button><p id="result" class="result" role="status" aria-live="polite"></p></div></main><script>const questions=[{"q": "Quanto é 1/2 de 20?", "a": ["5", "10", "15", "20"], "c": 1, "why": "Metade de 20 é 10."}, {"q": "Qual é a representação decimal de 3/4?", "a": ["0,25", "0,5", "0,75", "1,25"], "c": 2, "why": "3 dividido por 4 é 0,75."}, {"q": "Qual é a maior fração?", "a": ["1/4", "1/2", "1/8", "1/10"], "c": 1, "why": "Com numerador 1, o menor denominador dá a maior fração."}, {"q": "Quanto é 0,3 + 0,4?", "a": ["0,07", "0,7", "7", "0,34"], "c": 1, "why": "Três décimas mais quatro décimas são sete décimas."}, {"q": "Qual é a fração equivalente a 2/3?", "a": ["4/6", "2/6", "3/2", "6/4"], "c": 0, "why": "Multiplicar numerador e denominador por 2 dá 4/6."}, {"q": "Quanto é 25% de 100?", "a": ["5", "10", "25", "50"], "c": 2, "why": "25% corresponde a 25 em cada 100."}, {"q": "Quanto é 1,5 × 2?", "a": ["1,7", "2,5", "3", "30"], "c": 2, "why": "Uma unidade e meia vezes dois são três."}, {"q": "Qual é o resultado de 5/10 + 2/10?", "a": ["7/20", "7/10", "3/10", "10/10"], "c": 1, "why": "Somam-se os numeradores, mantendo o denominador."}];const quiz=document.getElementById('quiz');questions.forEach((x,i)=>{const d=document.createElement('section');d.className='card';const h=document.createElement('h2');h.textContent=(i+1)+'. '+x.q;d.appendChild(h);x.a.forEach((v,j)=>{const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;label.appendChild(input);label.appendChild(document.createTextNode(' '+String.fromCharCode(65+j)+') '+v));d.appendChild(label)});const f=document.createElement('p');f.className='feedback';f.setAttribute('aria-live','polite');d.appendChild(f);quiz.appendChild(d)});document.getElementById('check').onclick=()=>{let score=0,answered=0;[...quiz.children].forEach((d,i)=>{const selected=d.querySelector('input:checked');const f=d.querySelector('.feedback');if(selected){answered++;const ok=Number(selected.value)===questions[i].c;if(ok)score++;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✓ Correto. ':'✗ Incorreto. ')+questions[i].why}else{f.className='feedback bad';f.textContent='Por responder.'}});document.getElementById('result').textContent='Resultado: '+score+' / '+questions.length+' ('+Math.round(score/questions.length*100)+'%) · '+answered+' respostas dadas';try{localStorage.setItem('estudamais_matematica_extra_1',JSON.stringify({score,date:new Date().toISOString()}))}catch(e){}};document.getElementById('reset').onclick=()=>{quiz.reset();document.querySelectorAll('.feedback').forEach(x=>x.textContent='');document.getElementById('result').textContent=''};</script><script src="dificuldade.js"></script><script type="module" src="../firebase-app.js?v=54.5.6"></script><style id="ep-completion-style">button.ep-correct-pending:disabled{background:#d9e2ee!important;color:#45556a!important;border:1px solid #b8c7d9!important;opacity:1!important;cursor:not-allowed!important;-webkit-text-fill-color:#45556a!important}button.ep-correct-ready{background:#2066b2!important;color:#fff!important;-webkit-text-fill-color:#fff!important}</style><script id="ep-completion-script">(function(){function init(){const btn=[...document.querySelectorAll('button')].find(b=>/^Corrigir (respostas|ficha)$/i.test(b.textContent.trim()));if(!btn)return;function groups(){return [...new Set([...document.querySelectorAll('input[type="radio"][name]')].map(x=>x.name))].filter(n=>/^q\d+$/.test(n))}function update(){const names=groups();const complete=names.length>0&&names.every(n=>[...document.querySelectorAll('input[type="radio"]')].some(x=>x.name===n&&x.checked));btn.disabled=!complete;btn.classList.toggle('ep-correct-pending',!complete);btn.classList.toggle('ep-correct-ready',complete);btn.setAttribute('aria-disabled',String(!complete));}document.addEventListener('change',e=>{if(e.target.matches('input[type="radio"]'))update()});document.addEventListener('reset',()=>setTimeout(update,0));update();}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();</script></body></html>
